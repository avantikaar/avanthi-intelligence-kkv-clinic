name = "Avanthi Intelligence — KKV 360 Clinic Operations"
description = "Private, database-backed clinic operations and workflow automation with direct in-app data entry."
[auth]
enabled = true
providers = ["email"]
signup = "invite"
login_path = "/login"

# Google Sheets secrets were removed; this app uses direct database entry.

[[secret]]
name = "WHATSAPP_ACCESS_TOKEN"
required = false
expose = true
description = "Permanent or long-lived Meta WhatsApp Cloud API access token. Server-side only."

[[secret]]
name = "WHATSAPP_PHONE_NUMBER_ID"
required = false
expose = true
description = "Meta WhatsApp Business Cloud API phone number ID, not the visible phone number."

[[secret]]
name = "WHATSAPP_API_VERSION"
required = false
expose = true
description = "Optional Meta Graph API version, for example v23.0. Use a currently supported version from Meta."

[[secret]]
name = "WHATSAPP_TEMPLATE_LANGUAGE"
required = false
expose = true
description = "Approved WhatsApp template language code, e.g. en or en_US."

[[secret]]
name = "WHATSAPP_TEMPLATE_CONFIRMATION"
required = false
expose = true
description = "Exact approved WhatsApp template name for appointment confirmations. Default: appointment_confirmation."

[[secret]]
name = "WHATSAPP_TEMPLATE_REMINDER"
required = false
expose = true
description = "Exact approved WhatsApp template name for appointment reminders. Default: appointment_reminder."

[[secret]]
name = "WHATSAPP_WEBHOOK_VERIFY_TOKEN"
required = false
expose = true
description = "Meta webhook verification token used when registering the WhatsApp incoming webhook."