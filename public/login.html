<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff sign in · KKV 360</title><link rel="stylesheet" href="/theme.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#e9f5f2,#f6f9f9)}main{width:min(410px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow)}.brand{padding:0 0 25px}.login-form{display:grid;gap:12px}.login-form input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px}.login-form button{width:100%;justify-content:center}.msg{font-size:12px;color:var(--muted);min-height:20px}.msg.err{color:var(--danger)}h1{font-size:24px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 24px}</style></head><body><main><div class="brand"><div class="brand-mark">K</div><div class="brand-copy"><strong>AVANTHI INTELLIGENCE</strong><small>KKV 360° · Clinic operations</small></div></div><h1 id="title">Staff sign in</h1><p class="sub" id="sub">Use your invited staff email. We’ll send a one-time code; no password needed.</p><form id="form" class="login-form"><div id="email-row"><input id="email" type="email" autocomplete="username webauthn" autocapitalize="off" required placeholder="name@clinic.com" aria-label="Email address"></div><div id="code-row" hidden><input id="code" autocomplete="one-time-code" inputmode="numeric" maxlength="6" placeholder="6-digit code" aria-label="One-time code"></div><button class="btn btn-primary" id="submit" type="submit">Continue</button><button class="btn" id="back" type="button" hidden>Use a different email</button></form><p class="msg" id="msg" role="status" aria-live="polite"></p><div class="small muted">Access is restricted to invited staff. Do not use this workspace for unauthorized access to patient records.</div></main><script>(function(){var A=window.hatchable&&window.hatchable.auth,step='email';var form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code'),submit=document.getElementById('submit'),msg=document.getElementById('msg');function say(t,err){msg.textContent=t||'';msg.className='msg'+(err?' err':'')}function next(){var n=new URLSearchParams(location.search).get('next')||'/';location.replace(n.charAt(0)==='/'&&n.indexOf('//')!==0?n:'/')}if(!A){say('Authentication service is unavailable. Refresh and try again.',true);submit.disabled=true;return}A.getSession().then(function(s){if(s&&s.user)next()}).catch(function(){});document.getElementById('back').onclick=function(){step='email';document.getElementById('email-row').hidden=false;document.getElementById('code-row').hidden=true;document.getElementById('back').hidden=true;submit.textContent='Continue';say('')};form.onsubmit=function(e){e.preventDefault();submit.disabled=true;if(step==='email'){A.startLogin({email:email.value.trim()}).then(function(){step='code';document.getElementById('email-row').hidden=true;document.getElementById('code-row').hidden=false;document.getElementById('back').hidden=false;submit.textContent='Verify and sign in';say('Code sent. It expires in 10 minutes.');code.focus()}).catch(function(err){say(err&&err.message||'Could not send a sign-in code. Check the email and invitation status.',true)}).then(function(){submit.disabled=false})}else{A.finishLogin({email:email.value.trim(),code:code.value.trim()}).then(function(){next()}).catch(function(err){say(err&&err.message||'Code could not be verified. Request a new one and retry.',true)}).then(function(){submit.disabled=false})}}})()</script></body></html>
